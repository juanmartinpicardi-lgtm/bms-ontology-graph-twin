# Troop D Crime Lab: the building as read from the public bid set, the single source for the synthetic
# controls submittal, the synthetic BMS export and the answer key (scripts/build_troop_d.py).
#
# Source: State of Missouri project R2517-01 "Update HVAC & Chiller, Troop D Crime Lab", 425 East Phelps
# Street, Springfield MO 65806. Bid plans and specs dated 2025-10-06 (data/raw/troop_d/, see SOURCES.md).
# Every equipment row cites the sheet it comes from. Rooms and VAV locations are read from the floor plans
# (M-101 level 1, M-102 level 2, M-103 level 3): a box serves the room its thermostat sits in.
# `confidence: medium` marks a location where the plan is ambiguous (thermostat on a room boundary, in a
# corridor, or on another floor); the reasoning is in `note`.
#
# What is NOT from the bid set (invented for the synthetic submittal, marked in the answer key as such):
# controller models and addresses, the network, point names, BACnet instances, BMS names.

