# Known conflicts inside the bid set itself (kept as findings, not fixed).
design_issues:
  - id: DI-1
    text: "M-304 'VAV terminal units' heating paragraph describes an electric reheat coil, but the 19 VAV boxes on M-401 have no heater. The heating paragraph only applies to VAVE boxes."
  - id: DI-2
    text: "M-304 sequence lettering skips D (AHU) and E (VAV/FVAV)."
  - id: DI-3
    text: "No exhaust fan schedule: EF-LAB, EF-RR, EF-CONT, EF-LOCAL appear only on M-104 and M-304."
  - id: DI-4
    text: "FVAV15 heating cfm (360) is below its minimum primary cfm (840); every other FVAV has heating cfm about half of cooling."
