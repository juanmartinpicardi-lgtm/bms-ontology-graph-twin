# Hand answer key for the floor-plan reader (W6), Montana State University MBB (dev set).
#
# Made by hand on 24 Nov 2026, BEFORE any prompt for the plan_meaning job was written or tuned, from:
#   - the text layer and rendered images of 22-0045 Plans.pdf, pages 22-24 (M201, M202, M203);
#   - for the fan coils, the designer's own "EXISTING ERV UNIT BALANCING SCHEDULE" on M102 (page 21), whose
#     "ROOM/S SERVED" column names the room(s) each fan coil serves. Where it names two rooms, both are accepted
#     (the thermostat sits in one of them). "LAB 120" for FC-2.5 is read as the schedule's typo for LAB 220.
# The readers never read this file. It is only used by scoring/eval.py (job plan_meaning) after the fact.
#
# rooms: room number -> name, per sheet, for every room label printed on that sheet's plan views (the renovated
#        wings only: the rest of the building is not labelled).
# tags:  one entry per equipment tag drawn on these sheets. floor: where the unit is (RF: on the roof).
#        rooms: accepted rooms (any one is right); [] means "on the roof / in no room".
#        rel: serves (terminal unit, by its thermostat or the schedule) or located in.
# unsure: tags drawn on the sheets whose room this key does not decide; never scored.
set: msu_mbb
file: 22-0045 Plans.pdf
