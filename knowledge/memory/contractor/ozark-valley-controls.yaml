scope: contractor/ozark-valley-controls
description: >
  Ozark Valley Controls (fictitious): the controls contractor of the Troop D test package. Its submittal and BMS
  export are generated by troop_d.py, so what is known here is known exactly; do not treat it as field experience.
entries:
  - id: m-0201
    kind: fact
    text: >
      Metasys references read NAE/FC-n.DEVICE.POINT. A reference with FC-x is a typical: it applies to every
      device of the same tag prefix on the riser.
    source: {doc: src/projectmodel/intake/submittal.py}
    method: human
    author: project-model-team
    created: 2026-11-20
  - id: m-0202
    kind: fact
    text: >
      BMS device names drop the drawing tag's hyphen or change its case (VAVE07 for VAVE-07, CH01a for CH-1A).
      They are the same equipment.
    source: {doc: data/documents/troop_d/README.md}
    method: human
    author: project-model-team
    created: 2026-11-20
  - id: m-0203
    kind: warning
    text: >
      The submittal and the BMS export are synthetic test documents. Scores on them measure our readers, not
      field accuracy.
    source: {doc: data/documents/troop_d/README.md}
    method: human
