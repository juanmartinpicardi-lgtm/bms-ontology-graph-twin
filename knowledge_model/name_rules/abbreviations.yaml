# Worked examples, checked by the loader: name -> expected canonical words (first alternative).
examples:
  "Clg_Valve_Cmd": [cooling, valve, command]
  "Htg Valve Signal": [heating, valve, signal]
  "Occupied Clg Setpoint": [occupied, cooling, setpoint]
  "Unoccupied Htg Sp": [unoccupied, heating, setpoint]
  "Clg Dmpr Pos. %": [cooling, damper, position, percent]
  "Current Airflow": [actual, air, flow]
  "Space Temperature": [space, temperature]
  "SF VFD Signal": [supply, fan, vfd, signal]
  "OAT": [outside, air, temperature]
  "MAT": [mixed, air, temperature]
  "Econ_Cmd": [economizer, command]
  "DisAirTemp": [discharge, air, temperature]
  "EFStatus": [exhaust, fan, status]
  "AHU1 SAT": [ahu, "1", supply, air, temperature]
