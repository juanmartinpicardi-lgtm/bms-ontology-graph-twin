  sp: [[setpoint], [static, pressure]]     # "Clg Sp" vs "Duct SP"; mapper decides from neighbours
  stpt: [setpoint]
  spt: [setpoint]
  setpt: [setpoint]
  set: [setpoint]
  cmd: [command]
  cmnd: [command]
  sts: [status]
  stat: [[status], [zone, temperature, sensor]]   # "Fan Stat" vs room "Stat" (thermostat)
  st: [status]
  fb: [feedback]
  alm: [alarm]
  en: [enable]
  ena: [enable]
  enbl: [enable]
  sig: [signal]
  pos: [position]
  out: [output]
  op: [output]
  req: [desired]
  des: [desired]
  act: [actual]
  curr: [actual]
  current: [[actual], [current]]           # "Current Airflow" = actual airflow; also electrical current
  min: [minimum]
