# Name-parsing rules v0: how to turn a BMS point name into canonical words.
#
# Built from general BMS naming conventions and the Alpha dev set only. Bravo (test set) was not
# used. A few Bravo names were visible in earlier pipeline output, but none were added here because of that.
#
# Pipeline: tokenize -> lowercase -> look up each token -> canonical words.
#   - A token that is itself in `vocabulary` maps to itself.
#   - `abbreviations` values are either one expansion (list of words) or, for ambiguous tokens,
#     a list of alternatives (list of lists), most likely first; the mapper resolves them by context.
#   - Every expansion word must be in `vocabulary` (checked by the loader).

tokenizer:
  split_camel_case: true          # DisAirTemp -> Dis Air Temp ; EFStatus -> EF Status (acronym runs stay together)
  separators: '[^A-Za-z0-9%]+'    # spaces, _ - . / ( ) : etc.
  split_letter_digit: true        # AHU1 -> AHU 1 ; keep "1-2-21" style numbers as separate tokens
  lowercase: true
  # Applied before splitting, case-insensitive, on whole words: text -> single token.
  phrases:
    "s/s": ss          # start/stop
    "o/a": oa
    "r/a": ra
    "e/a": ea

vocabulary:
