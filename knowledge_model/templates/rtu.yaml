id: rtu
brick_class: RTU
description: Packaged rooftop unit. Supply fan, DX cooling stages, gas or electric heat and usually an economizer in one casing.
name_patterns: ['\bRTU\b', '\bRTU[-_ ]?\d']
point_count: [5, 45]
points:
  - {role: supply_temp, classes: [Discharge_Air_Temperature_Sensor, Supply_Air_Temperature_Sensor], required: true}
  - {role: supply_temp_sp, classes: [Discharge_Air_Temperature_Setpoint, Supply_Air_Temperature_Setpoint], required: false}
  - {role: return_temp, classes: [Return_Air_Temperature_Sensor], required: false}
  - {role: mixed_temp, classes: [Mixed_Air_Temperature_Sensor], required: false}
  - {role: outside_temp, classes: [Outside_Air_Temperature_Sensor], required: false}
  - {role: zone_temp, classes: [Zone_Air_Temperature_Sensor], required: false}
  - {role: zone_sp, classes: [Occupied_Cooling_Zone_Air_Temperature_Setpoint, Occupied_Heating_Zone_Air_Temperature_Setpoint, Target_Zone_Air_Temperature_Setpoint], required: false}
  - {role: static_pressure, classes: [Supply_Air_Static_Pressure_Sensor, Discharge_Air_Static_Pressure_Sensor], required: false}
  - {role: economizer_damper, classes: [Damper_Command, Damper_Position_Command], required: false}
  - {role: supply_fan_cmd, classes: [Fan_Command, Run_Enable_Command, Start_Stop_Command], required: false}
  - {role: supply_fan_speed, classes: [Fan_Speed_Command], required: false}
  - {role: supply_fan_status, classes: [Fan_Status, Run_Status, On_Off_Status], required: false}
  # Brick 1.4 has no compressor command: a cooling stage is an enable or command whose name says so.
  - {role: cooling_stage, classes: [Enable_Command, Run_Enable_Command, Start_Stop_Command, Command], required: false, words: [compressor, cooling]}
  - {role: heating_stage, classes: [Heating_Command, Heating_Enable_Command, Preheat_Command], required: false}
  - {role: filter_status, classes: [Filter_Status, Filter_Differential_Pressure_Sensor], required: false}
  - {role: occupancy, classes: [Occupancy_Command, Occupancy_Status, Mode_Command], required: false}
  - {role: alarm, classes: [Fault_Status, Alarm], required: false}
relations:
  - {rel: feeds, target: vav, medium: air, required: false}
