id: vav
brick_class: VAV
description: Variable air volume terminal unit (single or dual duct), optionally with reheat or a fan.
name_patterns: ['\bVAV\b', '\bVAVR?[-_ ]?\d', '\bDD\b', '\bFPB\b', '\bTU[-_ ]?\d', '\bBOX\b']
point_count: [3, 20]
points:
  - {role: zone_temp, classes: [Zone_Air_Temperature_Sensor], required: true}
  - {role: airflow, classes: [Discharge_Air_Flow_Sensor, Air_Flow_Sensor, Supply_Air_Flow_Sensor], required: true}
  - {role: airflow_sp, classes: [Discharge_Air_Flow_Setpoint, Air_Flow_Setpoint], required: false}
  - {role: damper, classes: [Damper_Command, Damper_Position_Command, Damper_Position_Sensor], required: true}
  - {role: discharge_temp, classes: [Discharge_Air_Temperature_Sensor], required: false}
  - {role: reheat_valve, classes: [Valve_Command, Valve_Position_Command], required: false}
  - {role: occ_cooling_sp, classes: [Occupied_Cooling_Zone_Air_Temperature_Setpoint], required: false}
  - {role: unocc_cooling_sp, classes: [Unoccupied_Cooling_Zone_Air_Temperature_Setpoint], required: false}
  - {role: occ_heating_sp, classes: [Occupied_Heating_Zone_Air_Temperature_Setpoint], required: false}
  - {role: unocc_heating_sp, classes: [Unoccupied_Heating_Zone_Air_Temperature_Setpoint], required: false}
  - {role: occupancy, classes: [Occupancy_Command, Occupancy_Status, Occupancy_Sensor], required: false}
  - {role: fan_cmd, classes: [Fan_Command, Fan_Status], required: false}
relations:
  - {rel: isFedBy, target: ahu, medium: air, required: true}
  - {rel: isFedBy, target: boiler, medium: hot_water, required: false}
