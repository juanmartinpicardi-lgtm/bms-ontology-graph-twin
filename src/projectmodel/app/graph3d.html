<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Graph 3D</title>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.0/dist/3d-force-graph.min.js"></script>
<!--__FONTS__-->
<style>
  /* Every colour is a token; the 3D scene reads them too. Design language as in the app: grey panels
     (#303030) on a near-black scene (#1E1E1E), cyan accent; light: white on #F0F0F0, blue accent. The app sets
     data-theme; the standalone page follows the system. */
  :root {
    color-scheme: light;
    --bg: #ffffff; --panel: rgba(255, 255, 255, 0.95); --line: #d0d0d0; --text: #303030; --muted: #606060;
    --accent: #1792e5; --chip: #f7f7f7; --none: #b0b0b0; --dim: rgba(144, 144, 144, 0.16); --cls-light: 48%;
    --k-equipment: #1792e5; --k-point: #909090; --k-class: #c48a00; --k-location: #1a9e95; --r-hasLocation: #1a9e95; --r-serves: #e8590c;
    --m-parsed: #1792e5; --m-rule: #1a9e95; --m-template: #8250df; --m-llm: #e8590c; --m-human: #007000; --m-model: #c48a00;
    --s-proposed: #bf8700; --s-confirmed: #007000; --s-rejected: #ee3124; --notes: #d6336c;
    --r-hasPart: #5b9fd6; --r-hasPoint: #d0d0d0; --r-feeds: #e8590c; --r-type: #dcc07a; --r-subClassOf: #c48a00;
    --r-behaviour: #c2369b; --m-document: #c2369b; --k-sequence: #c2369b; --r-controls: #c2369b; --r-mentions: #e7a3d3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1e1e1e; --panel: rgba(48, 48, 48, 0.95); --line: #505050; --text: #f0f0f0; --muted: #b0b0b0;
      --accent: #64c3ff; --chip: #272727; --none: #606060; --dim: rgba(80, 80, 80, 0.25); --cls-light: 60%;
      --k-equipment: #64c3ff; --k-point: #909090; --k-class: #f2b134; --k-location: #39c5bb; --r-hasLocation: #39c5bb; --r-serves: #f0883e;
      --m-parsed: #64c3ff; --m-rule: #39c5bb; --m-template: #a371f7; --m-llm: #f0883e; --m-human: #68d560; --m-model: #f2b134;
      --s-proposed: #d29922; --s-confirmed: #68d560; --s-rejected: #ff644c; --notes: #f778ba;
      --r-hasPart: #6eb3e8; --r-hasPoint: #404040; --r-feeds: #ff7b54; --r-type: #8a6d1f; --r-subClassOf: #f2b134;
      --r-behaviour: #ef6fc8; --m-document: #ef6fc8; --k-sequence: #ef6fc8; --r-controls: #ef6fc8; --r-mentions: #7a3a68;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1e1e1e; --panel: rgba(48, 48, 48, 0.95); --line: #505050; --text: #f0f0f0; --muted: #b0b0b0;
    --accent: #64c3ff; --chip: #272727; --none: #606060; --dim: rgba(80, 80, 80, 0.25); --cls-light: 60%;
    --k-equipment: #64c3ff; --k-point: #909090; --k-class: #f2b134; --k-location: #39c5bb; --r-hasLocation: #39c5bb; --r-serves: #f0883e;
    --m-parsed: #64c3ff; --m-rule: #39c5bb; --m-template: #a371f7; --m-llm: #f0883e; --m-human: #68d560; --m-model: #f2b134;
    --s-proposed: #d29922; --s-confirmed: #68d560; --s-rejected: #ff644c; --notes: #f778ba;
    --r-hasPart: #6eb3e8; --r-hasPoint: #404040; --r-feeds: #ff7b54; --r-type: #8a6d1f; --r-subClassOf: #f2b134;
    --r-behaviour: #ef6fc8; --m-document: #ef6fc8; --k-sequence: #ef6fc8; --r-controls: #ef6fc8; --r-mentions: #7a3a68;
  }
  .tip { background: var(--panel); color: var(--text); border: 1px solid var(--line); padding: 4px 8px;
    border-radius: 4px; font: 500 12px/1.4 "Roobert", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .tip .muted { color: var(--muted); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 500 13px/1.45 "Roobert", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  #graph { position: absolute; inset: 0; }
  .card { position: absolute; background: var(--panel); border: 1px solid var(--panel); border-radius: 10px;
    backdrop-filter: blur(6px); box-shadow: 0 4px 10px rgba(0, 0, 0, .25); }
  #toolbar { top: 12px; left: 12px; padding: 12px 14px; width: 300px; display: grid; gap: 8px; z-index: 3; }
  #toolbar h1 { font-size: 16px; line-height: 24px; font-weight: 700; margin: 0; }
  #toolbar, #panel, #legend { transition: opacity .2s, transform .2s; }
  .tbhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  #tbBody { display: grid; gap: 8px; }
  #toolbar.collapsed #tbBody { display: none; }
  .iconbtn { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; font-size: 16px; line-height: 1; }
  kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 0 5px; border-radius: 4px;
    border: 1px solid var(--line); background: var(--chip); }
  body.panel-open #vc, body.panel-open #vcHelp { transform: translateX(-392px); }
  #vc, #vcHelp { transition: transform .25s ease; }
  #panel.open { animation: slideIn .2s ease-out; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
  #toolbar .sub { color: var(--muted); font-size: 12px; margin-top: -4px; }
  label.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  select, input[type=text] { background: var(--chip); color: var(--text); border: 1px solid #909090;
    border-radius: 4px; padding: 5px 8px; font: inherit; }
  input[type=text] { width: 100%; }
  input[type=checkbox] { accent-color: var(--accent); }
  /* The layers, one per line in the order a building's documents add them, each with a switch on the right */
  .toggles { display: flex; flex-direction: column; gap: 2px; }
  .toggles .head { color: var(--muted); font-size: 12px; margin: 2px 0 2px; }
  .toggles label { display: flex; gap: 10px; align-items: center; justify-content: space-between; cursor: pointer;
    padding: 4px 2px; border-radius: 4px; }
  .toggles label:hover { background: var(--chip); }
  .toggles label[hidden] { display: none; }
  .toggles hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .toggles input[type=checkbox] { appearance: none; -webkit-appearance: none; flex: none; margin: 0; position: relative;
    width: 30px; height: 18px; border-radius: 9px; background: var(--line); cursor: pointer; transition: background .15s; }
  .toggles input[type=checkbox]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
  .toggles input[type=checkbox]:checked { background: var(--accent); }
  .toggles input[type=checkbox]:checked::after { transform: translateX(12px); }
  .toggles input[type=checkbox]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { background: var(--chip); color: var(--accent); border: 1px solid var(--accent); border-radius: 4px;
    padding: 5px 10px; font: inherit; font-weight: 700; cursor: pointer; }
  button:hover { background: color-mix(in srgb, var(--accent) 14%, var(--chip)); }
  #results { display: none; max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 4px; }
  #results div { padding: 5px 8px; cursor: pointer; border-bottom: 1px solid var(--line); }
  #results div:hover { background: var(--chip); }
  #results small, .muted { color: var(--muted); }
  #legend { left: 12px; bottom: 12px; padding: 8px 12px; max-width: 300px; z-index: 2; }
  #legend .item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  #legend .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #legend .ln { width: 16px; height: 3px; flex: none; }
  #stats { top: 12px; right: 12px; padding: 4px 6px 4px 12px; font-size: 12px; color: var(--muted); z-index: 4;
    display: flex; align-items: center; gap: 10px; }
  #rot { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--text);
    padding: 4px 6px; border-radius: 6px; font-weight: 600; }
  #rot:hover { background: var(--chip); }
  #rot .sw { position: relative; width: 30px; height: 18px; border-radius: 9px; background: var(--line); transition: background .15s; }
  #rot .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; transition: transform .15s; }
  #rot[aria-checked="true"] .sw { background: var(--accent); }
  #rot[aria-checked="true"] .sw::after { transform: translateX(12px); }
  #panel { top: 56px; right: 12px; bottom: 12px; width: 380px; padding: 14px; overflow: auto; display: none; z-index: 3; }
  #panel h2 { font-size: 20px; line-height: 30px; font-weight: 700; margin: 0 0 2px; word-break: break-word; }
  #panel h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }
  #panel table { width: 100%; border-collapse: collapse; }
  #panel td { border-top: 1px solid var(--line); padding: 4px 4px; vertical-align: top; word-break: break-word; }
  #panel td:first-child { color: var(--muted); width: 38%; }
  .chip { display: inline-block; background: var(--chip); border: 1px solid var(--line); border-radius: 999px;
    padding: 1px 8px; font-size: 12px; margin: 2px 4px 2px 0; }
  .nav { color: var(--accent); cursor: pointer; }
  .nav:hover { text-decoration: underline; }
  .close, .iconbtn { color: var(--muted); border-color: transparent; background: none; font-weight: 400; }
  .iconbtn { border: 1px solid #808080; }
  .close { position: absolute; top: 8px; right: 10px; border: none; font-size: 18px; }
  ul.nb { list-style: none; padding: 0; margin: 0; }
  ul.nb li { padding: 3px 0; border-top: 1px solid var(--line); }
  /* A narrow frame (a phone, or a side panel in the app): the options open over the graph, the legend folds away,
     the counts give way to the Rotate switch */
  @media (max-width: 620px) {
    #toolbar:not(.collapsed) { width: calc(100% - 24px); }
    #panel { top: auto; left: 12px; right: 12px; width: auto; height: 50%; }
    #legend, #statsText { display: none; }
  }
  @media (max-width: 900px) { #toolbar.collapsed { width: 200px; } }
</style>
</head>
<body>
<div id="graph"></div>

<div id="toolbar" class="card">
  <div class="tbhead">
    <div>
      <h1>Knowledge graph</h1>
      <div class="sub" id="project"></div>
    </div>
    <button id="collapse" class="iconbtn" title="Hide or show these options" aria-label="Hide options" aria-expanded="true">−</button>
  </div>
  <div id="tbBody">
  <input id="search" type="text" placeholder="Find equipment, point or class…" autocomplete="off">
  <div id="results"></div>
  <label class="row">Colour by
    <select id="colorBy">
      <option value="kind">Kind</option>
      <option value="cls">Class</option>
      <option value="confidence">Confidence</option>
      <option value="method">Method</option>
      <option value="status">Review status</option>
      <option value="notes">Has notes</option>
      <option value="doc" id="optDoc" hidden>Source document</option>
    </select>
  </label>
  <label class="row">Show around selection
    <select id="hops">
      <option value="0">Whole graph</option>
      <option value="1">1 step</option>
      <option value="2">2 steps</option>
      <option value="3">3 steps</option>
    </select>
  </label>
  <div class="toggles" role="group" aria-label="Layers">
    <div class="head">Layers, in the order the documents add them</div>
    <label id="lblLocations" hidden>Floors and rooms <input type="checkbox" role="switch" id="showLocations" checked></label>
    <label id="lblSequences" hidden>Sequences <input type="checkbox" role="switch" id="showSequences" checked></label>
    <label title="Loops, interlocks, resets, requests and modes from the sequences of operation (intent, not as built)">Behaviour (sequences) <input type="checkbox" role="switch" id="showBehaviour"></label>
    <label>Points <input type="checkbox" role="switch" id="showPoints" checked></label>
    <label>Knowledge model layer <input type="checkbox" role="switch" id="showModel"></label>
    <hr>
    <label>Animate feeds <input type="checkbox" role="switch" id="showFlow" checked></label>
  </div>
  <div style="display:flex; gap:6px; align-items:center;">
    <button id="clear">Clear selection</button>
    <span class="muted" style="font-size:12px">Press <kbd>?</kbd> for controls</span>
  </div>
  </div>
</div>

<div id="stats" class="card"><span id="statsText"></span><button id="rot" role="switch" aria-checked="false" title="Turn the graph slowly (R). Any drag stops it.">Rotate <span class="sw" aria-hidden="true"></span></button></div>
<div id="legend" class="card"></div>
<div id="panel" class="card"><button class="close" id="closePanel" aria-label="Close">×</button><div id="panelBody"></div></div>

<script>/*__CONTROLS__*/</script>
<script>
const DATA = /*__DATA__*/null;

// Colours come from the CSS tokens above, so the scene always matches the page theme.
const KIND_COLOR = {}, METHOD_COLOR = {}, STATUS_COLOR = {};
const REL = {
  hasPart:    { width: 1.2, arrow: 3, label: "has part" },
  hasPoint:   { width: 0.2, arrow: 0, label: "has point" },
  feeds:      { width: 1.6, arrow: 4, label: "feeds" },
  hasLocation: { width: 0.5, arrow: 2, label: "is located in" },
  serves:     { width: 0.5, arrow: 2, label: "serves (feeds a room)" },
  type:       { width: 0.2, arrow: 0, label: "is a (class)" },
  subClassOf: { width: 1.0, arrow: 3, label: "subclass of" },
  // From the sequences of operation read in the guided setup: which units a sequence controls, which points it uses.
  controls:   { width: 0.6, arrow: 2, label: "controls (sequence)" },
  mentions:   { width: 0.3, arrow: 0, label: "uses point (sequence)" },
  // Behaviour, from the sequences of operation (method document): intent, off by default.
  drives:     { width: 1.0, arrow: 3, label: "drives", behaviour: true },
  feedback:   { width: 1.0, arrow: 3, label: "feeds back to", behaviour: true },
  requires:   { width: 1.0, arrow: 3, label: "requires (interlock)", behaviour: true },
  resets:     { width: 1.0, arrow: 3, label: "resets", behaviour: true },
  requests:   { width: 1.0, arrow: 3, label: "requests", behaviour: true },
  switches:   { width: 1.0, arrow: 3, label: "switches mode of", behaviour: true },
};
const P = {};  // page colours
function readTheme() {
  const s = getComputedStyle(document.documentElement), v = n => s.getPropertyValue(n).trim();
  for (const k of ["equipment", "point", "class", "location", "sequence"]) KIND_COLOR[k] = v(`--k-${k}`);
  for (const k of ["parsed", "rule", "template", "llm", "human", "document", "model"]) METHOD_COLOR[k] = v(`--m-${k}`);
  for (const k of ["proposed", "confirmed", "rejected"]) STATUS_COLOR[k] = v(`--s-${k}`);
  for (const k of Object.keys(REL)) REL[k].color = v(REL[k].behaviour ? "--r-behaviour" : `--r-${k}`);
  Object.assign(P, { bg: v("--bg"), dim: v("--dim"), none: v("--none"), clsLight: v("--cls-light"), notes: v("--notes") });
}
readTheme();

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = v => typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(2)) : v;

// --- index -------------------------------------------------------------------------------------
const nodes = DATA.nodes;
const links = DATA.links.map(l => ({ ...l, s: l.source, t: l.target }));
const byId = new Map(nodes.map(n => [n.id, n]));
links.forEach(l => { if (!l.prov && l.rel === "type") l.prov = byId.get(l.s)?.prov; });  // sent once, on the node
const adj = new Map(nodes.map(n => [n.id, []]));
links.forEach(l => { adj.get(l.s).push(l); adj.get(l.t).push(l); });
const parentOf = new Map();  // point/equipment -> containing equipment
links.forEach(l => { if (l.rel === "hasPoint" || l.rel === "hasPart") parentOf.set(l.t, l.s); });
const conf = n => n.prov && typeof n.prov.confidence === "number" ? n.prov.confidence : null;

// class colour: stable hue per class name
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const clsColor = c => c ? `hsl(${hue(c)}, 65%, ${P.clsLight})` : P.none;
const confColor = c => {
  if (c === null) return P.none;
  // red (0) -> amber (0.5) -> green (1)
  const r = c < 0.5 ? 248 : Math.round(248 - (c - 0.5) * 2 * 185);
  const g = c < 0.5 ? Math.round(81 + c * 240) : 201;
  return `rgb(${r}, ${g}, 73)`;
};

const state = { colorBy: "kind", hops: 0, showLocations: true, showSequences: true, showPoints: true, showModel: false, showFlow: true, showBehaviour: false, selected: null };
let highlight = null;  // Set of node ids to keep bright, or null

function baseColor(n) {
  switch (state.colorBy) {
    case "cls": return n.kind === "class" ? KIND_COLOR.class : clsColor(n.cls);
    case "confidence": return n.kind === "class" ? KIND_COLOR.class : confColor(conf(n));
    case "method": return METHOD_COLOR[n.prov?.method] || P.none;
    case "status": return n.kind === "class" ? KIND_COLOR.class : (STATUS_COLOR[n.prov?.status] || P.none);
    case "notes": return n.notes ? P.notes : P.none;
    case "doc": return n.kind === "class" ? KIND_COLOR.class : clsColor(n.prov?.source_file);
    default: return KIND_COLOR[n.kind];
  }
}
const nodeColor = n => highlight && !highlight.has(n.id) ? P.dim : baseColor(n);
const nodeSize = n => n.kind === "equipment" ? 1 + Math.sqrt(n.attrs?.points || 1) * 0.5
  : n.kind === "class" ? 1.2 + Math.sqrt(n.attrs?.instances || 0) * 0.3
  : n.kind === "location" ? (n.cls === "Building" ? 8 : n.cls === "Floor" ? 3 : 0.3)
  : n.kind === "sequence" ? 2.2 : 0.35;

// --- visibility ----------------------------------------------------------------------------------
function layerOk(n) {
  if (n.kind === "point" && !state.showPoints) return false;
  if (n.kind === "location" && !state.showLocations) return false;
  if (n.kind === "sequence" && !state.showSequences) return false;
  if (n.layer === "model" && !state.showModel) return false;
  return true;
}
function linkLayerOk(l) {
  if ((l.rel === "type" || l.rel === "subClassOf") && !state.showModel) return false;
  if (REL[l.rel]?.behaviour && !state.showBehaviour) return false;
  return layerOk(byId.get(l.s)) && layerOk(byId.get(l.t));
}
function visible() {
  let keep = new Set(nodes.filter(layerOk).map(n => n.id));
  if (state.hops > 0 && state.selected?.kind === "node" && keep.has(state.selected.id)) {
    const seen = new Set([state.selected.id]); let frontier = [state.selected.id];
    for (let i = 0; i < state.hops; i++) {
      const next = [];
      for (const id of frontier) for (const l of adj.get(id)) {
        if (!linkLayerOk(l)) continue;
        const o = l.s === id ? l.t : l.s;
        if (!seen.has(o)) { seen.add(o); next.push(o); }
      }
      frontier = next;
    }
    keep = seen;
  }
  return {
    nodes: nodes.filter(n => keep.has(n.id)),
    links: links.filter(l => keep.has(l.s) && keep.has(l.t) && linkLayerOk(l)),
  };
}

// --- graph -------------------------------------------------------------------------------------
const el = document.getElementById("graph");
const Graph = ForceGraph3D({ controlType: "orbit" })(el)
  .backgroundColor(P.bg)
  .cooldownTime(7000)
  .nodeId("id")
  .nodeLabel(n => `<div class="tip"><b>${esc(n.label)}</b><br><span class="muted">${esc(n.kind)}${n.cls ? " · " + esc(n.cls) : ""}${conf(n) !== null ? " · " + conf(n).toFixed(2) : ""}</span></div>`)
  .nodeVal(nodeSize)
  .nodeColor(nodeColor)
  .nodeOpacity(0.92)
  .nodeResolution(10)
  .linkColor(l => highlight && !(highlight.has(l.s) && highlight.has(l.t)) ? P.dim : REL[l.rel]?.color || P.none)
  .linkWidth(l => (state.selected?.kind === "link" && state.selected.link === l ? 3 : REL[l.rel]?.width ?? 0.3))
  .linkOpacity(0.55)
  .linkDirectionalArrowLength(l => REL[l.rel]?.arrow || 0)
  .linkDirectionalArrowRelPos(1)
  .linkDirectionalParticles(l => state.showFlow && (l.rel === "feeds" || REL[l.rel]?.behaviour) ? (l.rel === "feeds" ? 3 : 1) : 0)
  .linkDirectionalParticleWidth(1.6)
  .linkDirectionalParticleSpeed(0.006)
  .linkLabel(l => `<div class="tip">${esc(byId.get(l.s).label)} <b>${esc(REL[l.rel]?.label || l.rel)}</b> ${esc(byId.get(l.t).label)}</div>`)
  .onNodeClick(n => { selectNode(n.id, true); if (parent === window) return;
    // A fact of the guided setup picks that fact; a graph node tells the app what is selected (agent context).
    parent.postMessage({ pm: "event", value: n.fact ? { name: "pick", id: n.fact }
                                                 : { name: "select", id: n.id, label: n.label, kind: n.kind } }, "*"); })
  .onLinkClick(l => selectLink(l))
  .onBackgroundClick(() => clearSelection())
  .onNodeHover(n => { el.style.cursor = n ? "pointer" : null; })
  .onLinkHover(l => { el.style.cursor = l ? "pointer" : null; })
  .width(window.innerWidth).height(window.innerHeight);

window.graph3d = Graph;  // handy from the browser console

// Soft camera: orbit with inertia, zoom towards the pointer, gentle auto-rotate when asked.
const ctl = Graph.controls();
Object.assign(ctl, { enableDamping: true, dampingFactor: 0.09, zoomToCursor: true, rotateSpeed: 0.7,
                     autoRotateSpeed: 0.55, screenSpacePanning: true });

// Fit the camera to the shown nodes. (The library's zoomToFit picked a far too close distance here.)
function fitView(ms = 800, margin = 1) {
  const ns = Graph.graphData().nodes.filter(n => Number.isFinite(n.x));
  if (!ns.length) return;
  const c = ["x", "y", "z"].map(k => ns.reduce((s, n) => s + n[k], 0) / ns.length);
  // Frame the body of the graph, not its farthest stray node: the 95th percentile of the distances from the centre.
  const ds = ns.map(n => Math.hypot(n.x - c[0], n.y - c[1], n.z - c[2])).sort((a, b) => a - b);
  const r = Math.max(10, ds[Math.min(ds.length - 1, Math.floor(ds.length * 0.95))] * 1.08);
  const cam = Graph.camera(), fov = (cam.fov || 40) * Math.PI / 180;
  const half = Math.min(fov, 2 * Math.atan(Math.tan(fov / 2) * (cam.aspect || 1))) / 2;
  const d = r / Math.sin(half) * 1.05 * margin;
  const p = Graph.cameraPosition();
  let dir = [p.x - c[0], p.y - c[1], p.z - c[2]];
  const len = Math.hypot(...dir) || 1;
  dir = len < 1e-6 ? [0, 0, 1] : dir.map(v => v / len);
  Graph.cameraPosition({ x: c[0] + dir[0] * d, y: c[1] + dir[1] * d, z: c[2] + dir[2] * d }, { x: c[0], y: c[1], z: c[2] }, ms);
}

let fitted = false;
// The engine also "stops" once on the empty graph before data arrives, so only count a fit with nodes.
// Instant: an animated move here gets overridden by the library's own initial camera placement.
const firstFit = () => { if (!fitted && Graph.graphData().nodes.length) { fitted = true; fitView(0); } };
Graph.onEngineStop(firstFit);
setTimeout(firstFit, 7500);  // just after the 7 s cooldown; the engine-stop event can be late in an embedded frame
let moved = false;  // the person turned or zoomed: from then on the camera is theirs
["pointerdown", "wheel"].forEach(ev => el.addEventListener(ev, () => { fitted = true; moved = true; }, { once: true }));
let refit = null;
window.addEventListener("resize", () => {
  Graph.width(window.innerWidth).height(window.innerHeight);
  // The app sizes this frame to the screen after it loads: keep the whole graph centred until the person moves it.
  if (!moved && fitted) { clearTimeout(refit); refit = setTimeout(() => fitView(0), 60); }
});

// Standalone page: follow the system theme as it changes (the app passes its theme instead).
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  readTheme(); Graph.backgroundColor(P.bg); refresh(false);
});

function refresh(resetData) {
  if (resetData) Graph.graphData(visible());
  Graph.nodeColor(Graph.nodeColor()).linkColor(Graph.linkColor()).linkWidth(Graph.linkWidth())
       .linkDirectionalParticles(Graph.linkDirectionalParticles());
  renderStats(); renderLegend();
}

// --- selection & navigation ----------------------------------------------------------------------
function flyTo(n) {
  if (n.x === undefined) { setTimeout(() => flyTo(n), 300); return; }
  const d = 140 + nodeSize(n) * 10, r = Math.hypot(n.x, n.y, n.z) || 1, k = 1 + d / r;
  Graph.cameraPosition({ x: n.x * k, y: n.y * k, z: n.z * k }, n, 1200);
}
function ensureVisible(n) {
  let changed = false;
  if (n.kind === "point" && !state.showPoints) { state.showPoints = true; document.getElementById("showPoints").checked = true; changed = true; }
  if (n.layer === "model" && !state.showModel) { state.showModel = true; document.getElementById("showModel").checked = true; changed = true; }
  return changed;
}
function selectNode(id, fly, panel = true) {
  const n = byId.get(id);
  const changed = ensureVisible(n);
  state.selected = { kind: "node", id };
  highlight = new Set([id]);
  for (const l of adj.get(id)) if (linkLayerOk(l)) { highlight.add(l.s); highlight.add(l.t); }
  refresh(changed || state.hops > 0);
  if (panel) renderNodePanel(n);
  else { document.getElementById("panel").style.display = "none"; document.body.classList.remove("panel-open"); }
  if (fly) flyTo(n);
}
function selectLink(l) {
  state.selected = { kind: "link", link: l };
  highlight = new Set([l.s, l.t]);
  refresh(false);
  renderLinkPanel(l);
}
function clearSelection() {
  state.selected = null; highlight = null;
  document.getElementById("panel").style.display = "none";
  document.body.classList.remove("panel-open");
  refresh(state.hops > 0);
}

// --- panel -------------------------------------------------------------------------------------
const nav = id => `<span class="nav" data-id="${esc(id)}">${esc(byId.get(id)?.label ?? id)}</span>`;
function rows(obj) {
  return Object.entries(obj).filter(([, v]) => v !== undefined && v !== null && v !== "")
    .map(([k, v]) => `<tr><td>${esc(k)}</td><td>${typeof v === "object" ? esc(JSON.stringify(v)) : esc(fmt(v))}</td></tr>`).join("");
}
function provRows(p) {
  if (!p) return "";
  const r = { method: p.method, confidence: p.confidence, status: p.status, "source file": p.source_file,
              "source ref": p.source_ref, revision: p.revision, "defined in": p.defined_in, "model group": p.class_kind ? `${p.source_ref} (${p.class_kind})` : undefined };
  if (p.method === "model") delete r["source ref"];
  if (p.review) r.review = `${p.review.action} by ${p.review.by} at ${String(p.review.at).slice(0, 16)}`;
  if (p.convention) r.convention = p.convention.join(", ");
  if (p.ignore) r["flagged (ignore)"] = `${p.ignore.reason} (${p.ignore.convention})`;
  return rows(r);
}
// Notes are read-only here; they are written in the review app (Tree tab).
function notesHtml(key) {
  const ns = (DATA.notes || {})[key] || [];
  if (!ns.length) return "";
  return `<h3>Notes (${ns.length})</h3><ul class="nb">` + ns.map(x =>
    `<li><span class="chip">${esc(x.topic)}</span>${esc(x.body)}<br><span class="muted">${esc(x.author)} · ${esc(String(x.updated_at).slice(0, 16))}${x.source !== "manual" ? " · " + esc(x.source) : ""}</span></li>`).join("") + `</ul>`;
}
function breadcrumb(id) {
  const chain = []; let cur = parentOf.get(id), guard = 0;
  while (cur && guard++ < 20) { chain.unshift(cur); cur = parentOf.get(cur); }
  return chain.length ? chain.map(nav).join(" › ") + " › " : "";
}
// Equipment with a 3D model (knowledge_model/templates/anchors.yaml) link to the Equipment 3D page. In the app this
// viewer sits in a sandboxed same-origin iframe that may not navigate the top window, so the link is clicked in the
// app's own document (the app navigates); a new tab if that is not reachable.
const EQ3D_TEMPLATES = ["ahu", "vav", "fcu", "chiller", "boiler", "pump"];
function openInApp(href) {
  try {
    const a = top.document.createElement("a");
    a.href = href;
    top.document.body.appendChild(a);
    a.click();
    a.remove();
  } catch (e) { open(href, "_blank"); }
}
function renderNodePanel(n) {
  const a = n.attrs || {};
  let h = `<div class="muted" style="font-size:12px">${breadcrumb(n.id)}</div><h2>${esc(n.label)}</h2>`;
  h += `<span class="chip">${esc(n.kind)}</span>`;
  if (n.cls && n.kind !== "class") h += `<span class="chip">${byId.has("cls:" + n.cls) ? nav("cls:" + n.cls) : esc(n.cls)}</span>`;
  if (n.kind === "equipment" && EQ3D_TEMPLATES.includes(a.template) && parent !== window)
    h += `<p><a class="open3d" href="/Equipment_3D?${new URLSearchParams({ project: DATA.project, equip: n.id })}">Open 3D equipment</a></p>`;
  h += `<h3>${n.kind === "class" ? "Definition" : "Provenance of this node"}</h3><table>${provRows(n.prov)}</table>`;
  const extra = {};
  if (a.points !== undefined) extra["points (from mapper)"] = a.points;
  if (a.instances !== undefined) extra["instances in this project"] = a.instances;
  if (a.template) extra.template = a.template;
  if (a.grouping) extra.grouping = a.grouping;
  if (a.path) extra["folder path"] = a.path;
  if (a.words) extra["name words"] = a.words.join(" ");
  if (a.unknown_tokens?.length) extra["unknown tokens"] = a.unknown_tokens.join(", ");
  if (a.alternatives) extra["alternatives (class, score)"] = a.alternatives.map(([c, s]) => `${c} (${fmt(s)})`).join(", ");
  if (a.evidence) extra.evidence = a.evidence;
  if (Object.keys(extra).length) h += `<h3>Evidence</h3><table>${rows(extra)}</table>`;
  h += notesHtml(n.id);

  // neighbours grouped by relation and direction
  const groups = new Map();
  for (const l of adj.get(n.id)) {
    const out = l.s === n.id, other = out ? l.t : l.s;
    const key = out ? `${REL[l.rel]?.label || l.rel} →` : `← ${REL[l.rel]?.label || l.rel}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ other, l });
  }
  for (const [key, items] of groups) {
    items.sort((x, y) => byId.get(x.other).label.localeCompare(byId.get(y.other).label));
    const shown = items.slice(0, 60);
    h += `<h3>${esc(key)} (${items.length})</h3><ul class="nb">` + shown.map(({ other, l }) =>
      `<li>${nav(other)} <span class="muted">· <span class="nav" data-link="${links.indexOf(l)}">link</span> · ${esc(l.prov?.method || "")}${typeof l.prov?.confidence === "number" ? " " + l.prov.confidence.toFixed(2) : ""}</span></li>`).join("") +
      (items.length > shown.length ? `<li class="muted">…and ${items.length - shown.length} more</li>` : "") + `</ul>`;
  }
  openPanel(h);
}
function renderLinkPanel(l) {
  let h = `<h2>${nav(l.s)} <span class="muted">${esc(REL[l.rel]?.label || l.rel)}</span> ${nav(l.t)}</h2>`;
  h += `<span class="chip">link · ${esc(l.rel)}</span><h3>Provenance of this link</h3><table>${provRows(l.prov)}</table>`;
  if (l.rel === "type") h += `<p class="muted">The class assignment of the instance; its provenance is the instance's own.</p>`;
  else h += notesHtml(`${l.s}|${l.rel}|${l.t}`);
  openPanel(h);
}
function openPanel(html) {
  const p = document.getElementById("panel");
  document.getElementById("panelBody").innerHTML = html;
  p.style.display = "block";
  p.classList.remove("open"); void p.offsetWidth; p.classList.add("open");
  document.body.classList.add("panel-open");
}
document.getElementById("panel").addEventListener("click", e => {
  const o = e.target.closest("a.open3d");
  if (o) { e.preventDefault(); openInApp(o.getAttribute("href")); return; }
  const t = e.target.closest("[data-id],[data-link]");
  if (!t) return;
  if (t.dataset.link !== undefined) selectLink(links[+t.dataset.link]);
  else selectNode(t.dataset.id, true);
});
document.getElementById("closePanel").onclick = clearSelection;

// --- search ------------------------------------------------------------------------------------
const searchEl = document.getElementById("search"), resultsEl = document.getElementById("results");
searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  if (!q) { resultsEl.style.display = "none"; return; }
  const hits = [];
  for (const n of nodes) {
    const where = n.attrs?.path || (parentOf.has(n.id) ? byId.get(parentOf.get(n.id)).label : "");
    if (n.label.toLowerCase().includes(q) || (n.cls || "").toLowerCase().includes(q) || where.toLowerCase().includes(q)) {
      hits.push({ n, where, rank: (n.kind === "equipment" ? 0 : n.kind === "class" ? 1 : 2) + (n.label.toLowerCase().startsWith(q) ? 0 : 3) });
    }
  }
  hits.sort((x, y) => x.rank - y.rank || x.n.label.localeCompare(y.n.label));
  resultsEl.innerHTML = hits.slice(0, 40).map(({ n, where }) =>
    `<div data-id="${esc(n.id)}">${esc(n.label)} <small>· ${esc(n.kind)}${n.cls && n.kind !== "class" ? " · " + esc(n.cls) : ""}${where ? " · " + esc(where) : ""}</small></div>`).join("")
    + (hits.length > 40 ? `<div class="muted">${hits.length - 40} more…</div>` : "")
    + (hits.length ? "" : `<div class="muted">No match</div>`);
  resultsEl.style.display = "block";
});
resultsEl.addEventListener("click", e => {
  const t = e.target.closest("[data-id]");
  if (!t) return;
  resultsEl.style.display = "none";
  selectNode(t.dataset.id, true);
});

// --- controls, stats, legend -------------------------------------------------------------------
document.getElementById("colorBy").onchange = e => { state.colorBy = e.target.value; refresh(false); };
document.getElementById("hops").onchange = e => { state.hops = +e.target.value; refresh(true); };
for (const k of ["showPoints", "showLocations", "showSequences", "showModel", "showFlow", "showBehaviour"]) {
  document.getElementById(k).onchange = e => {
    state[k] = e.target.checked;
    if (state.selected?.kind === "node" && !layerOk(byId.get(state.selected.id))) clearSelection();
    refresh(k !== "showFlow");
  };
}
document.getElementById("clear").onclick = clearSelection;
// Shown only for graphs that have them: floors and rooms, and a source document per node (the guided setup).
if (nodes.some(n => n.kind === "location")) document.getElementById("lblLocations").hidden = false;
if (nodes.some(n => n.kind === "sequence")) document.getElementById("lblSequences").hidden = false;
if (DATA.by_document) document.getElementById("optDoc").hidden = false;
// Inside the app's guided setup the page that holds this viewer listens: a click on a node opens its source there,
// and the app can select a node here. Harmless anywhere else.
addEventListener("message", e => {
  if (e.data?.pm !== "data") return;
  const id = e.data.data?.select, n = id && nodes.find(n => n.fact === id || (n.facts || []).includes(id));
  if (n && state.selected?.id !== n.id) selectNode(n.id, false, false);
  else if (!n && state.selected) clearSelection();
});
if (parent !== window) parent.postMessage({ pm: "ready" }, "*");
const toolbar = document.getElementById("toolbar"), collapseBtn = document.getElementById("collapse");
function setCollapsed(on) {
  toolbar.classList.toggle("collapsed", on);
  collapseBtn.textContent = on ? "+" : "−";
  collapseBtn.setAttribute("aria-expanded", !on);
  try { localStorage.setItem("graph3d-collapsed", on ? "1" : "0"); } catch (e) {}
}
collapseBtn.onclick = () => setCollapsed(!toolbar.classList.contains("collapsed"));
try {
  const saved = localStorage.getItem("graph3d-collapsed");
  if (saved === "1" || (saved === null && DATA.by_document)) setCollapsed(true);
} catch (e) { if (DATA.by_document) setCollapsed(true); }

function toggleLayer(k) {
  const box = document.getElementById(k);
  box.checked = !box.checked;
  box.onchange({ target: box });
}
function zoom(f) {
  const t = ctl.target, p = Graph.cameraPosition();
  Graph.cameraPosition({ x: t.x + (p.x - t.x) * f, y: t.y + (p.y - t.y) * f, z: t.z + (p.z - t.z) * f },
                       { x: t.x, y: t.y, z: t.z }, 450);
}
const vc = ViewerControls.mount({
  surface: el,
  zoom, fit: () => { moved = false; fitView(); }, rotate: on => { ctl.autoRotate = on; },
  gestures: [["Drag", "Rotate"], ["Right-drag or Shift-drag", "Pan"], ["Scroll or pinch", "Zoom towards the pointer"],
             ["Click a node or link", "Select it and show its details"], ["Click empty space", "Clear the selection"]],
  keys: [["/", "Search", () => { setCollapsed(false); searchEl.focus(); }],
         ["Esc", "Clear the selection", () => clearSelection()],
         ["P", "Points on / off", () => toggleLayer("showPoints")],
         ["M", "Knowledge model layer on / off", () => toggleLayer("showModel")],
         ["B", "Behaviour (sequences) on / off", () => toggleLayer("showBehaviour")]],
});

// The Rotate switch (top right) and the rotate button of the controls are one setting. Slow, and any drag or wheel
// stops it. In the guided setup it starts on, unless the person switched it off.
const rotBtn = document.getElementById("rot");
vc.onRotate(on => rotBtn.setAttribute("aria-checked", on));
// Only a deliberate switch is remembered; a drag that stops the turning is not.
rotBtn.onclick = () => {
  vc.setRotate(!vc.rotating());
  try { localStorage.setItem("graph3d-rotate", vc.rotating() ? "1" : "0"); } catch (e) {}
};
let rotateFirst = !!DATA.by_document;  // the guided setup's graph
try { const r = localStorage.getItem("graph3d-rotate"); if (r !== null) rotateFirst = r === "1"; } catch (e) {}
if (rotateFirst) vc.setRotate(true);

function renderStats() {
  const d = Graph.graphData();
  document.getElementById("statsText").textContent = `${d.nodes.length.toLocaleString()} nodes · ${d.links.length.toLocaleString()} links`;
}
function renderLegend() {
  const sw = (c, t) => `<div class="item"><span class="sw" style="background:${c}"></span>${esc(t)}</div>`;
  const ln = (c, t) => `<div class="item"><span class="ln" style="background:${c}"></span>${esc(t)}</div>`;
  let h = "";
  if (state.colorBy === "kind") h += Object.entries(KIND_COLOR).filter(([k]) => (k !== "class" || state.showModel) && (!["location", "sequence"].includes(k) || nodes.some(n => n.kind === k))).map(([k, c]) => sw(c, k)).join("");
  if (state.colorBy === "method") h += Object.entries(METHOD_COLOR).map(([k, c]) => sw(c, k)).join("");
  if (state.colorBy === "status") h += Object.entries(STATUS_COLOR).map(([k, c]) => sw(c, k)).join("");
  if (state.colorBy === "doc") h += [...new Set(nodes.filter(n => n.layer !== "model").map(n => n.prov?.source_file).filter(Boolean))].map(f => sw(clsColor(f), f)).join("");
  if (state.colorBy === "notes") h += sw(P.notes, "has active notes") + sw(P.none, "no notes");
  if (state.colorBy === "confidence") h += [0, 0.5, 0.8, 1].map(v => sw(confColor(v), `confidence ${v}`)).join("") + sw(P.none, "no confidence");
  if (state.colorBy === "cls") {
    const cnt = new Map();
    Graph.graphData().nodes.forEach(n => { if (n.kind === "equipment") cnt.set(n.cls, (cnt.get(n.cls) || 0) + 1); });
    h += `<div class="muted">Equipment classes</div>` + [...cnt].sort((a, b) => b[1] - a[1]).slice(0, 10).map(([c, k]) => sw(clsColor(c), `${c || "(none)"} (${k})`)).join("");
  }
  const rels = new Set(Graph.graphData().links.map(l => l.rel));
  h += `<div style="height:6px"></div>` + Object.entries(REL).filter(([r]) => rels.has(r)).map(([, v]) => ln(v.color, v.label)).join("");
  document.getElementById("legend").innerHTML = h;
}

document.getElementById("project").textContent =
  `${DATA.project} · ${Object.entries(DATA.counts.nodes).map(([k, v]) => `${v} ${k}`).join(" · ")}`;
// A graph that grew since this browser last showed it (a document was just read, or a project was just finished)
// bursts out from its centre: every node starts near the middle with a push outwards, and the forces spread it.
let burst = false;
if (DATA.burst) {
  const key = "graph3d-burst:" + String(DATA.burst).split(":")[0];
  try { burst = localStorage.getItem(key) !== DATA.burst; localStorage.setItem(key, DATA.burst); } catch (e) { burst = true; }
}
if (burst) {
  // Every node starts in a small ball at the centre; heavy damping for the first seconds turns the forces' first
  // violent push into a visible, smooth burst, then the layout settles as usual.
  for (const n of nodes) {
    const u = Math.random() * 2 - 1, a = Math.random() * 2 * Math.PI, s = Math.sqrt(1 - u * u), r = 4 + Math.random() * 14;
    [n.x, n.y, n.z] = [s * Math.cos(a) * r, s * Math.sin(a) * r, u * r];
  }
  Graph.d3VelocityDecay(0.9);
  [[700, 0.8], [1500, 0.65], [2400, 0.5], [3200, 0.4]].forEach(([t, d]) => setTimeout(() => Graph.d3VelocityDecay(d), t));
  // Follow it out while it spreads (a big graph spreads for longer), unless the person takes the camera.
  // The camera stays a little ahead of the spread (margin), then settles on the whole graph.
  const t1 = performance.now(), follow = setInterval(() => {
    if (moved) { clearInterval(follow); return; }
    if (performance.now() - t1 > 6800) { clearInterval(follow); fitted = true; fitView(1400); return; }
    fitView(550, 1.5);
  }, 500);
}
refresh(true);
</script>
</body>
</html>
