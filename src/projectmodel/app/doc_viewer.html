<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document</title>
<!--__FONTS__-->
<style>
  /* The document a step read, page by page, with what was read outlined. Same controls as the building and the graph
     on the right: drag to move, wheel to zoom, + / − / fit / full screen in the corner. */
  :root { --bg: #f0f0f0; --panel: rgba(255,255,255,.96); --line: #d0d0d0; --text: #303030; --muted: #707070;
    --accent: #1792e5; --chip: #f7f7f7; --paper: 0 2px 14px rgba(0,0,0,.14); }
  :root[data-theme="dark"] { --bg: #1e1e1e; --panel: rgba(48,48,48,.96); --line: #505050; --text: #f0f0f0;
    --muted: #a0a0a0; --accent: #64c3ff; --chip: #272727; --paper: 0 4px 22px rgba(0,0,0,.55); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 500 13px/1.45 "Roobert", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #stage { position: absolute; inset: 0; cursor: grab; touch-action: none; }
  #stage.drag { cursor: grabbing; }
  #page { position: absolute; left: 0; top: 0; transform-origin: 0 0; box-shadow: var(--paper); background: #fff;
    user-select: none; -webkit-user-drag: none; image-rendering: auto; }
  #page.anim { transition: transform .45s cubic-bezier(.2,.7,.2,1); }
  .card { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(6px); box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  #pager { left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px;
    padding: 3px; z-index: 4; }
  #pager button { width: 32px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: var(--text);
    cursor: pointer; font-size: 18px; line-height: 1; }
  #pager button:hover:not(:disabled) { background: var(--chip); color: var(--accent); }
  #pager button:disabled { opacity: .35; cursor: default; }
  #label { padding: 0 10px; white-space: nowrap; font-weight: 600; }
  #legend { right: 12px; top: 12px; padding: 6px 10px; font-size: 12px; display: flex; gap: 4px 10px; z-index: 3;
    flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 210px); white-space: nowrap; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  #top { left: 12px; top: 12px; display: flex; gap: 2px; padding: 3px; z-index: 4; }
  #top button { border: 0; border-radius: 7px; background: transparent; color: var(--text); cursor: pointer;
    padding: 5px 10px; font: inherit; font-weight: 600; }
  #top button:hover { background: var(--chip); color: var(--accent); }
  #top button[hidden] { display: none; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  @media (max-width: 560px) { #legend { display: none; } }
</style>
</head>
<body>
<div id="stage"><img id="page" alt="" draggable="false"></div>
<div id="empty">Loading the page…</div>
<div id="top" class="card">
  <button id="bWidth" title="Fit the page's width (W)">Fit width</button>
  <button id="bSel" title="Go to the selected item (S)" hidden>Selection</button>
</div>
<div id="legend" class="card"></div>
<div id="pager" class="card">
  <button id="prev" title="Previous page (←)" aria-label="Previous page">‹</button>
  <span id="label"></span>
  <button id="next" title="Next page (→)" aria-label="Next page">›</button>
</div>
<script>/*__CONTROLS__*/</script>
<script>
const $ = id => document.getElementById(id);
const stage = $("stage"), img = $("page");
let D = null, k = 1, x = 0, y = 0, key = null, moved = false;

function apply(anim) {
  img.classList.toggle("anim", !!anim);
  img.style.transform = `translate(${x}px, ${y}px) scale(${k})`;
}
const W = () => stage.clientWidth, H = () => stage.clientHeight;
const PAD = 18, BOTTOM = 56;  // keep the page clear of the pager

function fitPage(anim) {
  if (!D) return;
  k = Math.min((W() - 2 * PAD) / D.w, (H() - PAD - BOTTOM) / D.h);
  x = (W() - D.w * k) / 2; y = PAD + (H() - PAD - BOTTOM - D.h * k) / 2;
  moved = false; apply(anim);
}
function fitWidth(anim) {
  if (!D) return;
  k = (W() - 2 * PAD) / D.w; x = PAD; y = PAD;
  moved = true; apply(anim);
}
function toFocus(anim) {
  if (!D || !D.focus) return fitPage(anim);
  const [x0, y0, x1, y1] = D.focus, bw = Math.max(40, x1 - x0), bh = Math.max(30, y1 - y0);
  k = Math.min(W() / (bw * 3.2), (H() - BOTTOM) / (bh * 4.5), 3 * W() / D.w + 2);
  k = Math.max(k, Math.min((W() - 2 * PAD) / D.w, (H() - PAD - BOTTOM) / D.h));
  x = W() / 2 - (x0 + bw / 2) * k; y = (H() - BOTTOM) / 2 - (y0 + bh / 2) * k;
  moved = true; apply(anim);
}
function zoomAt(f, cx = W() / 2, cy = H() / 2, anim = false) {
  const nk = Math.min(12, Math.max(0.05, k * f));
  x = cx - (cx - x) * nk / k; y = cy - (cy - y) * nk / k; k = nk;
  moved = true; apply(anim);
}

// drag to move, wheel to zoom at the pointer, double-click to zoom in
let drag = null;
stage.addEventListener("pointerdown", e => {
  if (e.button !== 0 && e.button !== 1) return;
  drag = { px: e.clientX, py: e.clientY, x, y }; stage.classList.add("drag"); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  x = drag.x + e.clientX - drag.px; y = drag.y + e.clientY - drag.py; moved = true; apply(false);
});
const end = () => { drag = null; stage.classList.remove("drag"); };
stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);
stage.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || Math.abs(e.deltaY) >= Math.abs(e.deltaX)) zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)), e.clientX, e.clientY);
  else { x -= e.deltaX; moved = true; apply(false); }
}, { passive: false });
stage.addEventListener("dblclick", e => zoomAt(1.8, e.clientX, e.clientY, true));

function go(page) {
  if (!D || page < 0 || page >= D.pages || page === D.page) return;
  parent.postMessage({ pm: "event", value: { name: "page", page, file: D.file } }, "*");
}
$("prev").onclick = () => go(D.page - 1);
$("next").onclick = () => go(D.page + 1);
$("bWidth").onclick = () => fitWidth(true);
$("bSel").onclick = () => toFocus(true);

ViewerControls.mount({
  surface: stage,
  zoom: f => zoomAt(1 / f, W() / 2, H() / 2, true),
  fit: () => fitPage(true),
  keys: [["W", "Fit the page's width", () => fitWidth(true)], ["S", "Go to the selected item", () => toFocus(true)],
         ["← / →", "Previous / next page", e => go(D.page + (e.key === "ArrowLeft" ? -1 : 1))]],
  gestures: [["Drag", "Move the page"], ["Wheel / pinch", "Zoom to the pointer"], ["Double-click", "Zoom in there"],
             ["‹ ›", "Previous / next page"]],
});

let resizeT = null;
addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { if (!moved) fitPage(false); else if (D?.focus && !drag) toFocus(false); }, 60);
});

function setData(d) {
  document.documentElement.dataset.theme = d.theme === "light" ? "light" : "dark";
  const sameImage = D && d.key === key, focusChanged = JSON.stringify(D?.focus) !== JSON.stringify(d.focus);
  D = d;
  $("label").textContent = d.label;
  $("prev").disabled = d.page <= 0; $("next").disabled = d.page >= d.pages - 1;
  $("pager").style.display = d.pages > 1 ? "flex" : "none";
  $("bSel").hidden = !d.focus;
  $("legend").innerHTML = d.legend || "";
  $("legend").style.display = d.legend ? "flex" : "none";
  if (sameImage) { if (focusChanged) toFocus(true); return; }
  key = d.key;
  img.onload = () => { $("empty").style.display = "none"; d.focus ? toFocus(false) : fitPage(false); };
  img.src = d.img;
}
addEventListener("message", e => { if (e.data?.pm === "data") setData(e.data.data); });
parent.postMessage({ pm: "ready" }, "*");
</script>
</body>
</html>
