# The app's design language (see the comment above THEME in src/projectmodel/app/shell.py): dark-first, a black
# top bar and rail, flat outlined panels on a #202020 page, one light-blue accent, near-square corners, regular
# weights. A light and a dark section keep Streamlit's light/dark switch in the menu, where a single [theme] would
# remove it.
#
# Font: Roobert (variable, weights 300-900), from Roobert.zip at the repo root. Streamlit serves it from
# src/projectmodel/app/static/fonts/; the standalone HTML views inline the same file (src/projectmodel/fonts.py).

[server]
enableStaticServing = true

[theme]
font = "Roobert"
headingFont = "Roobert"
baseFontSize = 14          # body: 14/20
baseFontWeight = 400       # body text is Regular
headingFontWeights = [400, 500, 500, 500, 500, 500]
headingFontSizes = ["24px", "20px", "16px", "14px", "14px", "12px"]  # heading-5, subtitle-1, subtitle-2, body
baseRadius = "4px"         # panels and tables
buttonRadius = "4px"       # buttons
showWidgetBorder = true

[[theme.fontFaces]]
family = "Roobert"
url = "app/static/fonts/RoobertVF.woff2"
weight = "300 900"
style = "normal"

[theme.dark]
primaryColor = "#7CC1FA"              # accent: tabs, links, count pills
backgroundColor = "#202020"           # page
secondaryBackgroundColor = "#303030"  # gray-1000: cards, toolsets, inputs
textColor = "#F0F0F0"                 # text/text-primary
linkColor = "#7CC1FA"
borderColor = "#585858"               # panel outlines
dataframeBorderColor = "#454545"      # table row lines
dataframeHeaderBackgroundColor = "#202020"  # header row in the rows' colour
dataframeHeaderTextColor = "#FFFFFF"
codeBackgroundColor = "#272727"
redColor = "#FF644C"                  # graphic/graphic-bad
greenColor = "#89B445"                # semantic/good
blueColor = "#7CC1FA"

[theme.light]
primaryColor = "#1792E5"              # base/blue-600
backgroundColor = "#F0F0F0"
secondaryBackgroundColor = "#FFFFFF"  # color-component-container-background-1-light
textColor = "#303030"                 # color-font-base-default-light
linkColor = "#005EAC"                 # color-font-blue-light
borderColor = "#D0D0D0"
dataframeBorderColor = "#DDDDDD"
dataframeHeaderBackgroundColor = "#FFFFFF"
dataframeHeaderTextColor = "#303030"
redColor = "#EE3124"
greenColor = "#007000"
blueColor = "#1792E5"
